<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Management</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Responsive Navigation / Header -->
  <header class="navbar">
    <div class="nav-container">
      <div class="brand">
        <span class="logo">📦</span>
        <div>
          <h2>Product Manager</h2>
          <p>Full-stack CRUD Demo</p>
        </div>
      </div>
      <button class="btn btn-primary" id="openAddModalBtn">+ Add Product</button>
    </div>
  </header>

  <main class="container">
    <!-- Dynamic Stats Area -->
    <div class="stats-grid">
      <div class="stat-card">
        <p>Total Products</p>
        <h3 id="statTotal">0</h3>
      </div>
      <div class="stat-card">
        <p>In Stock</p>
        <h3 id="statInStock">0</h3>
      </div>
      <div class="stat-card">
        <p>Out of Stock</p>
        <h3 id="statOutOfStock">0</h3>
      </div>
      <div class="stat-card">
        <p>Inventory Value</p>
        <h3 id="statValue">$0.00</h3>
      </div>
    </div>

    <!-- Product Card Grid -->
    <div id="productGrid" class="product-grid">
      <!-- Dynamic Products Will Render Here -->
    </div>
  </main>

  <!-- Modal Form (Add / Edit) -->
  <div class="modal-overlay" id="productModal">
    <div class="modal">
      <h3 id="modalTitle">Add New Product</h3>
      <form id="productForm">
        <input type="hidden" id="productId">

        <div class="form-group">
          <label>Title</label>
          <input type="text" id="title" required placeholder="e.g. Cotton T-Shirt">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Category</label>
            <select id="category">
              <option value="Clothing">Clothing</option>
              <option value="Electronics">Electronics</option>
              <option value="Accessories">Accessories</option>
            </select>
          </div>
          <div class="form-group">
            <label>Status</label>
            <select id="status">
              <option value="In Stock">In Stock</option>
              <option value="Out of Stock">Out of Stock</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>Price ($)</label>
          <input type="number" step="0.01" id="price" required placeholder="24.00">
        </div>

        <div class="form-group">
          <label>Description</label>
          <textarea id="description" rows="3" placeholder="Short description..."></textarea>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="closeModalBtn">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Product</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
